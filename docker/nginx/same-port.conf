user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Detect TLS without terminating it. Plain HTTP and TLS then enter separate,
# private HTTP servers sharing the same application routing configuration.
stream {
    map $ssl_preread_protocol $mockdeck_listener {
        ""      127.0.0.1:8080;
        default 127.0.0.1:8443;
    }

    server {
        listen 80;
        ssl_preread on;
        proxy_pass $mockdeck_listener;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Only the local stream listener can supply a trusted PROXY header.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    include /etc/nginx/conf.d/*.conf;
}
