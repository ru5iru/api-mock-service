root /var/www/html/public;
index index.php;
charset utf-8;

# Security headers
# Note: Strict-Transport-Security (HSTS) is intentionally omitted here.
# It must be set by the CDN or TLS-terminating reverse proxy in front of this
# container, because nginx cannot add it reliably without terminating TLS itself.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
# Two 2 MiB Postman files plus worst-case JSON-RPC escaping; Laravel enforces per-file caps.
client_max_body_size 25m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

location ~ ^/index\.php(/|$) {
    # Docker may assign app a different IP when its container is recreated.
    # A variable defers lookup to Docker DNS rather than pinning the startup IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $mockdeck_fastcgi app:9000;
    fastcgi_pass $mockdeck_fastcgi;
    # Fail stale/dead backend connections before the client probe times out.
    fastcgi_connect_timeout 2s;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTP_PROXY "";
    fastcgi_read_timeout 60s;
    internal;
}

location ~ /\. {
    deny all;
}
