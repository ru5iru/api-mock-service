root /var/www/html/public;
index index.php;
charset utf-8;
client_max_body_size 10m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

location ~ ^/index\.php(/|$) {
    # Docker may assign app a different IP when its container is recreated.
    # A variable defers lookup to Docker DNS rather than pinning the startup IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $mockdeck_fastcgi app:9000;
    fastcgi_pass $mockdeck_fastcgi;
    # Fail stale/dead backend connections before the client probe times out.
    fastcgi_connect_timeout 2s;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTP_PROXY "";
    fastcgi_read_timeout 60s;
    internal;
}

location ~ /\. {
    deny all;
}
