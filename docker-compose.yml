x-app-environment: &app-environment
  APP_NAME: MockDeck
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:18473}
  APP_KEY: ${APP_KEY:-base64:replace-with-32-random-bytes-in-base64}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-mock_api}
  DB_USERNAME: ${DB_USERNAME:-mock_api}
  DB_PASSWORD: ${DB_PASSWORD:-replace-this-too}
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  LOG_CHANNEL: stderr
  MOCK_LOG_STDOUT: "true"
  MOCK_LOG_FILE: "true"
  MOCK_LOG_DAYS: ${MOCK_LOG_DAYS:-14}
  MOCK_MAX_DELAY_MS: ${MOCK_MAX_DELAY_MS:-30000}
  MOCK_DASHBOARD_AUTH_ENABLED: ${MOCK_DASHBOARD_AUTH_ENABLED:-true}
  MOCK_DASHBOARD_USERNAME: ${MOCK_DASHBOARD_USERNAME:-admin}
  MOCK_DASHBOARD_PASSWORD: ${MOCK_DASHBOARD_PASSWORD:-change-this-too}
  RUN_MIGRATIONS: "true"

services:
  app:
    image: mockdeck-laravel-app:latest
    build:
      context: .
      args:
        APP_ENV: ${BUILD_APP_ENV:-local}
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - mock_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) === false ? 1 : 0);'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18473}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  callback-worker:
    image: mockdeck-laravel-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=callbacks", "--sleep=1", "--tries=1", "--timeout=240"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mock_api}
      POSTGRES_USER: ${DB_USERNAME:-mock_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-this-too}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  mock_logs:
