services:
  app:
    build:
      context: .
      args:
        APP_ENV: ${BUILD_APP_ENV:-local}
    restart: unless-stopped
    environment:
      APP_NAME: MockDeck
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:18473}
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-mock_api}
      DB_USERNAME: ${DB_USERNAME:-mock_api}
      DB_PASSWORD: ${DB_PASSWORD:-mock_api}
      CACHE_STORE: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
      MOCK_LOG_STDOUT: "true"
      MOCK_LOG_FILE: "true"
      MOCK_LOG_DAYS: ${MOCK_LOG_DAYS:-14}
      MOCK_MAX_DELAY_MS: ${MOCK_MAX_DELAY_MS:-30000}
      RUN_MIGRATIONS: "true"
    volumes:
      - mock_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18473}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mock_api}
      POSTGRES_USER: ${DB_USERNAME:-mock_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mock_api}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  mock_logs:
