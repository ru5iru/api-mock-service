name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo_sqlite
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Prepare writable Laravel directories
        run: mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Validate design tokens
        run: python3 scripts/validate_design_tokens.py

      - name: Test frontend components
        run: make frontend-test setup-test

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          MOCK_DASHBOARD_AUTH_ENABLED: 'false'
          MOCK_LOG_STDOUT: 'false'
          MOCK_LOG_FILE: 'false'

      - name: Install browser tooling
        run: |
          make browser-install

      - name: Check dashboard layouts and documentation in both themes
        env:
          APP_ENV: local
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/browser.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          MOCK_DASHBOARD_AUTH_ENABLED: 'false'
          MOCK_LOG_STDOUT: 'false'
          MOCK_LOG_FILE: 'false'
          MOCKDECK_BASE_URL: http://127.0.0.1:18476
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php artisan serve --host=127.0.0.1 --port=18476 > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused "$MOCKDECK_BASE_URL/up"
          MOCKDECK_BROWSER_FIXTURE=1 make browser-registry-test
          MOCKDECK_BROWSER_FIXTURE=1 make browser-editor-test
          MOCKDECK_BROWSER_FIXTURE=1 make browser-response-test
          MOCKDECK_BROWSER_FIXTURE=1 make browser-selection-test
          MOCKDECK_BROWSER_FIXTURE=1 make browser-supporting-test
          make browser-test
          MOCKDECK_BROWSER_FIXTURE=1 make browser-regression-test

      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-checks
          path: |
            tests/Browser/screenshots/
            ${{ runner.temp }}/browser-server.log
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Do not inherit a developer's HTTPS selection from .env.example.
      # The TLS step overrides COMPOSE_FILE only after generating its certificate.
      COMPOSE_FILE: docker-compose.yml
      COMPOSE_PATH_SEPARATOR: ':'
      APP_PORT: '18473'
      APP_URL: http://localhost:18473
      MOCK_DASHBOARD_AUTH_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare disposable instance secrets
        run: |
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Validate through the supported Make workflow
        run: make validate

      - name: Prove MCP works without external networking
        run: make mcp-offline-test

      - name: Verify the plain HTTP Compose selection
        run: |
          docker compose config --format json > "$RUNNER_TEMP/http-compose.json"
          python3 - "$RUNNER_TEMP/http-compose.json" <<'PYCODE'
          import json, sys
          with open(sys.argv[1]) as source:
              nginx = json.load(source)['services']['nginx']
          targets = {volume['target'] for volume in nginx['volumes']}
          forbidden = {'/etc/nginx/nginx.conf', '/etc/nginx/conf.d/https.conf', '/etc/nginx/certs'}
          assert not targets & forbidden, 'Plain HTTP CI unexpectedly selected HTTPS mounts'
          assert len(nginx['ports']) == 1, 'Expected one published port'
          port = nginx['ports'][0]
          assert str(port['published']) == '18473' and port['target'] == 80, 'Unexpected HTTP binding'
          PYCODE

      - name: Start and check plain HTTP
        run: |
          make up
          make health

      - name: Verify Nginx recovers after the app receives a new IP
        run: python3 scripts/smoke_upstream_recreation.py

      - name: Characterize global saves on guarded PostgreSQL
        run: |
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" mockdeck_save_characterization_test'
          docker compose run --rm -e APP_ENV=testing -e RUN_MIGRATIONS=false \
            -e DB_CONNECTION=pgsql -e DB_DATABASE=mockdeck_save_characterization_test \
            -e AUDIT_DB=mockdeck_save_characterization_test -e CACHE_STORE=array -e SESSION_DRIVER=array \
            -e MOCK_DASHBOARD_AUTH_ENABLED=false -e MOCK_LOG_STDOUT=false -e MOCK_LOG_FILE=false \
            app php artisan test tests/Feature/EndpointSaveCharacterizationTest.php

      - name: Prove concurrent run routing on PostgreSQL
        run: |
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" mockdeck_run_isolation_test'
          docker compose run --rm -e APP_ENV=testing -e RUN_MIGRATIONS=false \
            -e DB_CONNECTION=pgsql -e DB_DATABASE=mockdeck_run_isolation_test \
            -e MOCKDECK_RUN_CONCURRENCY_POSTGRES=true -e CACHE_STORE=array -e SESSION_DRIVER=array \
            -e MOCK_DASHBOARD_AUTH_ENABLED=false -e MOCK_LOG_STDOUT=false -e MOCK_LOG_FILE=false \
            app php artisan test --filter=ConcurrentRunRoutingTest

      - name: Prove concurrent MCP mutations on PostgreSQL
        run: |
          docker compose run --rm -e APP_ENV=testing -e RUN_MIGRATIONS=false \
            -e DB_CONNECTION=pgsql -e DB_DATABASE=mockdeck_run_isolation_test \
            -e MOCKDECK_MCP_CONCURRENCY_POSTGRES=true -e CACHE_STORE=array -e SESSION_DRIVER=array \
            -e MOCK_DASHBOARD_AUTH_ENABLED=false -e MOCK_LOG_STDOUT=false -e MOCK_LOG_FILE=false \
            app php artisan test --filter=ConcurrentMcpMutationTest

      - name: Generate temporary localhost certificate
        run: |
          mkdir -p docker/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1' \
            -keyout docker/nginx/certs/localhost-key.pem -out docker/nginx/certs/localhost.pem

      - name: Check HTTP and trusted HTTPS on the same port
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
          APP_URL: https://localhost:18473
          MOCKDECK_SMOKE_CA: docker/nginx/certs/localhost.pem
        run: |
          make compose-config
          make up
          docker compose exec -T nginx nginx -t
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            --cacert "$MOCKDECK_SMOKE_CA" "$APP_URL/up"
          make https-check

      - name: Collect container diagnostics
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app nginx callback-worker db

      - name: Remove disposable containers and volumes
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
        run: docker compose down --volumes --remove-orphans
