name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo_sqlite
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Prepare writable Laravel directories
        run: mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Validate design tokens
        run: python3 scripts/validate_design_tokens.py

      - name: Test frontend components
        run: make frontend-test

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          MOCK_DASHBOARD_AUTH_ENABLED: 'false'
          MOCK_LOG_STDOUT: 'false'
          MOCK_LOG_FILE: 'false'

      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Check dashboard layouts and documentation in both themes
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/browser.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          MOCK_DASHBOARD_AUTH_ENABLED: 'false'
          MOCK_LOG_STDOUT: 'false'
          MOCK_LOG_FILE: 'false'
          MOCKDECK_BASE_URL: http://127.0.0.1:18476
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php artisan serve --host=127.0.0.1 --port=18476 > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused "$MOCKDECK_BASE_URL/up"
          make browser-test

      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            tests/Browser/screenshots/
            ${{ runner.temp }}/browser-server.log
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOCK_DASHBOARD_AUTH_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare disposable instance secrets
        run: |
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Validate through the supported Make workflow
        run: make validate

      - name: Start and check plain HTTP
        run: |
          make up
          make health

      - name: Generate temporary localhost certificate
        run: |
          mkdir -p docker/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1' \
            -keyout docker/nginx/certs/localhost-key.pem -out docker/nginx/certs/localhost.pem

      - name: Check HTTP and trusted HTTPS on the same port
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
          APP_URL: https://localhost:18473
          MOCKDECK_SMOKE_CA: docker/nginx/certs/localhost.pem
        run: |
          make compose-config
          make up
          docker compose exec -T nginx nginx -t
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            --cacert "$MOCKDECK_SMOKE_CA" "$APP_URL/up"
          make https-check

      - name: Collect container diagnostics
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app nginx callback-worker db

      - name: Remove disposable containers and volumes
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.https.yml
        run: docker compose down --volumes --remove-orphans
